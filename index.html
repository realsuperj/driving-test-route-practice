<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>科三路线记忆练习</title>
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#1d2a2a;--mute:#5d6b6b;--line:#d8d5c8;--acc:#0f6b6b;--accbg:#d9eeee;--ok:#1d7a3a;--okbg:#dcf2e1;--bad:#b3261e;--badbg:#fbe3e0;--warn:#8a5a00;--warnbg:#fff0c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1a;--card:#1c2727;--ink:#eef3f1;--mute:#9db0ad;--line:#33443f;--acc:#6fd0cc;--accbg:#1d3a3a;--ok:#7fdc98;--okbg:#1b3524;--bad:#ff8f86;--badbg:#3d2220;--warn:#f2c46a;--warnbg:#3a2f14;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:19px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:24px;margin:6px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
button{font:inherit;font-size:19px;padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:54px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mantra{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row button{flex:1;min-width:84px}
.big{font-size:34px;font-weight:800;line-height:1.25;margin:4px 0 8px}
.small{color:var(--mute);font-size:16px}
.tip{background:var(--accbg);border-radius:10px;padding:10px 12px;margin-top:10px}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 4px;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.list b{color:var(--acc)}
.opts{display:grid;gap:10px;margin-top:12px}
.opts button{text-align:left;padding:14px}
.opts button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:12px;font-weight:700}
.score{color:var(--mute);font-size:16px;margin-bottom:8px}
.hide{display:none}
:root{--road:#c3c6bf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--road:#3b4b48}}
.tabs button{font-size:17px;padding:14px 2px}
.mk{fill:var(--card);stroke:var(--acc);stroke-width:2}
.mt{font-size:10px;font-weight:700;fill:var(--ink);text-anchor:middle}
.act .mk{fill:var(--acc)}
.act .mt{fill:var(--card)}
.gl{fill:none;stroke:#ffb300;stroke-width:3;animation:bk .6s steps(2) infinite}
@keyframes bk{50%{opacity:.15}}
#ab{min-height:150px}
.auto .mk{stroke:#d8402f;stroke-width:3;fill:#ffe1dd}
.auto .mt{fill:#b3261e;font-size:13px}
.auto.act .mk{fill:#d8402f}
.auto.act .mt{fill:#fff}
.tabs{background:var(--accbg);padding:6px;border-radius:18px;gap:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;color:var(--ink);min-height:68px;border-radius:13px;font-size:17px;padding:6px 2px;line-height:1.3}
.tabs button.on{background:var(--acc);color:var(--bg)}
.ic{display:block;font-size:24px;line-height:1.2}
.row button{min-height:46px;font-size:18px;border-radius:999px;padding:6px 10px}
.row button.on{background:var(--accbg);color:var(--acc);border-color:var(--acc);font-weight:700}
.row:not(.seg)::before{content:"选择路线";flex-basis:100%;color:var(--mute);font-size:15px}
.seg{background:var(--line);padding:4px;border-radius:12px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:46px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.row button{min-width:68px}
main{padding:10px 12px 120px}
h1{font-size:20px;margin:2px 0 8px}
.mantra{font-size:15px;padding:8px 12px;margin-bottom:10px}
.big{font-size:30px}
.card{padding:14px;margin-bottom:12px}
.nav .on{flex:1.5}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;margin:0;border-radius:18px 18px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.18);z-index:20}
.tabs button{min-height:58px;font-size:15px}
.ic{font-size:22px}
#ab{min-height:112px;padding:12px}
#ab .big{font-size:26px;margin:2px 0 6px}
#ab .tip{font-size:16px;margin-top:6px;padding:8px 10px}
#wn{font-size:15px;padding:6px 10px;margin-bottom:6px!important}
#map{max-height:54vh!important}
#p4 .row::before{display:none}
#p4 .nav{margin-top:10px}
#p4 .nav button{min-height:46px;font-size:17px;padding:6px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#0c5a5a,#13a3a0);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(15,107,107,.3)}
.hero h1{margin:0;font-size:22px;color:#fff;letter-spacing:1px}
.hero .sub{font-size:14px;opacity:.92;margin-top:2px}
.hero .hi{font-size:36px;line-height:1}
#gm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:600}
.mt0{font-size:13px;background:var(--warn);color:var(--warnbg);border-radius:6px;padding:1px 8px}
.ch{background:var(--card);color:var(--ink);border-radius:999px;padding:1px 10px}
button{transition:transform .08s,box-shadow .15s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:active{transform:scale(.97)}
.card{border:1px solid var(--line);border-radius:18px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.row{margin-bottom:14px}
.nav button.on{background:linear-gradient(135deg,#0c5a5a,#12908e);border-color:transparent;color:#fff;box-shadow:0 3px 8px rgba(15,107,107,.35)}
.tabs button.on{background:linear-gradient(135deg,#0c5a5a,#12908e);color:#fff;box-shadow:0 2px 8px rgba(15,107,107,.35)}
.bar{height:12px;border-radius:8px}
.bar i{background:linear-gradient(90deg,#12908e,#0c5a5a);border-radius:8px;transition:width .25s}
#p1 .card>.small:first-child{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.tip{border-left:5px solid var(--acc);border-radius:10px}
.tip[style*="--badbg"]{border-left-color:var(--bad)}
#p1 .list li{display:flex;align-items:center;gap:10px;padding:9px 4px}
.nb{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accbg);color:var(--acc);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.opts button{border-radius:14px;box-shadow:0 2px 0 var(--line)}
.score{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--ink)}
#map{box-shadow:0 3px 12px rgba(0,0,0,.1)}
main>.small{text-align:center;margin-top:18px}
</style>
</head>
<body>
<main>
<header class="hero"><div><h1>科三路线记忆练习</h1><div class="sub">C2 · 羊草庄考场 · 三条路线 + 灯光</div></div><div class="hi">🚗</div></header>
<div class="mantra" id="gm"><span class="mt0">变道口诀</span><span class="ch">灯（3秒）</span>→<span class="ch">镜</span>→<span class="ch">回头</span>→<span class="ch">打</span>→<span class="ch">回正</span>→<span class="ch">关灯</span></div>
<div class="tabs">
<button id="t1" class="on"><span class="ic">📍</span>背路线</button>
<button id="t3"><span class="ic">💡</span>背灯光</button>
<button id="t4"><span class="ic">🚗</span>看动画</button>
<button id="t2"><span class="ic">✏️</span>练习场</button>

</div>

<section id="p1"></section>
<section id="p2" class="hide"></section>
<section id="p3" class="hide"></section>
<section id="p4" class="hide"></section>
<p class="small">路线顺序依据教练的图整理，如与实际练车不一致，以教练为准。</p>
</main>

<script>
var TIPS={
start:"打左灯 → 踩刹车 → 挂D档 → 放手刹 → 三看一回头 → 慢踩油门。出发路段限速30。",
turn:"打灯3秒以上 → 停止线前轻踩刹车 → 三看一回头 → 让直行车 → 打轮 → 完成后关灯。",
zone:"没有语音提示！到位置自己轻踩刹车，30以下，右左看。",
meet:"语音提示后：轻踩刹车，右左看。",
lane:"灯、镜、头、打、关：打灯3秒以上，三看一回头，打轮变道，完成后关灯。",
over:"左灯3秒 → 三看一回头 → 向左变道 → 5秒后 → 右灯 → 三看一回头 → 向右变道 → 关灯。",
uturn:"左灯3秒以上 → 踩刹车减速 → 三看一回头 → 左打死 → 进左2道。",
straight:"速度约25，方向盘微调不超过5度，直到项目结束。",
cross:"绿灯直行：轻踩刹车，右左看。红灯：停车，起步三看一回头。",
park:"右灯 → 刹车减速 → 三看一回头 → 向右变道 → 关灯 → 对齐字 → P档 → 手刹 → 熄火 → 解安全带 → 三看一回头 → 下车 → 15秒内关门。"
};
function S(n,k,extra){return{n:n,t:TIPS[k],x:extra||""}}
var R={
"一号线":[
S("起点：左灯起步","start"),
S("右转","turn"),
S("经过模拟学校","zone","没有语音，自己记得刹车"),
S("左转","turn"),
S("直线行驶","straight"),
S("左转","turn"),
S("路口直行","cross"),
S("会车","meet"),
S("变更车道","lane"),
S("掉头","uturn"),
S("自主变道","lane"),
S("超车","over"),
S("右转","turn"),
S("靠边停车（终点）","park")],
"二号线":[
S("起点：左灯起步","start"),
S("右转","turn"),
S("经过模拟学校","zone","没有语音，自己记得刹车"),
S("右转","turn"),
S("经过公交站","zone","没有语音，自己记得刹车"),
S("右转","turn"),
S("会车","meet"),
S("自主变道","lane"),
S("直线行驶","straight"),
S("变更车道","lane"),
S("掉头","uturn"),
S("超车","over"),
S("自主变道","lane"),
S("左转","turn"),
S("自主变道","lane"),
S("靠边停车（终点）","park")],
"三号线":[
S("起点：左灯起步","start"),
S("右转","turn"),
S("经过模拟学校","zone","没有语音，自己记得刹车"),
S("右转","turn"),
S("自主变道","lane"),
S("路口直行","cross"),
S("会车","meet"),
S("变道超车","over"),
S("变更车道","lane"),
S("掉头","uturn"),
S("直线行驶","straight"),
S("自主变道","lane"),
S("左转","turn"),
S("自主变道","lane"),
S("靠边停车（终点）","park")]
};
var NAMES=Object.keys(R);
var $=function(i){return document.getElementById(i)};

/* tabs */
function show(n){
 $("gm").style.display=(n===1||n===4)?"":"none";
 window.scrollTo(0,0);
 for(var i=1;i<=4;i++){$("p"+i).classList.toggle("hide",i!==n);$("t"+i).classList.toggle("on",i===n)}
}
$("t1").onclick=function(){show(1)};
$("t2").onclick=function(){show(2);newQ()};
$("t3").onclick=function(){show(3)};
$("t4").onclick=function(){show(4)};

/* learn */
var cur="一号线",idx=0;
function learn(){
 var st=R[cur],s=st[idx],h='<div class="row">';
 NAMES.forEach(function(n){h+='<button data-r="'+n+'" class="'+(n===cur?"on":"")+'">'+n+'</button>'});
 h+='</div><div class="bar"><i style="width:'+((idx+1)/st.length*100)+'%"></i></div>';
 h+='<div class="card"><div class="small">第 '+(idx+1)+' / '+st.length+' 步</div><div class="big">'+s.n+'</div>';
 if(s.x)h+='<div class="small">'+s.x+'</div>';
 h+='<div class="tip"'+(s.a?' style="background:var(--badbg);color:var(--bad);font-weight:700"':'')+'>'+(s.a?'⚠ 没有语音提示！<br>':'')+s.t+'</div>';
 var nx=st[idx+1];
 h+='<div class="small" style="margin-top:12px">接下来：'+(nx?'<b>'+nx.n+'</b>':'考试结束')+'</div>';
 h+='<div class="nav"><button id="pv">上一步</button><button id="nx" class="on">下一步</button></div></div>';
 h+='<div class="card"><b>整条路线一口气念：</b><ul class="list">';
 st.forEach(function(x,i){h+='<li'+(i===idx?' style="background:var(--accbg);border-radius:8px"':'')+'><span class="nb">'+(i+1)+'</span>'+(x.a?'<b style="color:var(--bad)">⚠ '+x.n+'（没语音，自己动手）</b>':x.n)+'</li>'});
 h+='</ul></div>';
 $("p1").innerHTML=h;
 $("p1").querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){cur=b.dataset.r;idx=0;learn()}});
 $("pv").onclick=function(){if(idx>0){idx--;learn()}};
 $("nx").onclick=function(){if(idx<st.length-1){idx++;learn()}};
}

/* quiz */
var ok=0,tot=0,q;
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuf(a){return a.sort(function(){return Math.random()-.5})}
function newQ(){
 var r=pick(NAMES),st=R[r],i=Math.floor(Math.random()*(st.length-1)),ans;
 if(Math.random()<0.6){var c=[];st.forEach(function(x,k){if(k>0&&x.a)c.push(k-1)});if(c.length)i=pick(c)}
 ans=st[i+1].n;
 var pool=[];
 NAMES.forEach(function(n){R[n].forEach(function(x){if(x.n!==ans&&pool.indexOf(x.n)<0)pool.push(x.n)})});
 var opts=shuf([ans].concat(shuf(pool).slice(0,3)));
 q={r:r,i:i,ans:ans,done:false};
 var h='<div class="score">答对 '+ok+' / '+tot+'</div><div class="card"><div class="small">'+r+'</div>';
 if(i>0)h+='<div class="small">前一步：'+st[i-1].n+'</div>';
 h+='<div class="small">刚做完：</div><div class="big">'+st[i].n+'</div><div>接下来是什么？</div><div class="opts">';
 opts.forEach(function(o){h+='<button data-a="'+o+'">'+o+'</button>'});
 h+='</div><div id="fb" class="fb"></div><div class="nav"><button id="nq" class="on hide">下一题</button></div></div>';
 $("p2").innerHTML=h;
 $("p2").querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){answer(b)}});
 $("nq").onclick=newQ;
}
function answer(b){
 if(q.done)return;
 var st=R[q.r],a=b.dataset.a,good=a===q.ans;
 tot++;if(good){ok++;q.done=true}else{b.classList.add("bad");b.disabled=true;return}
 b.classList.add("ok");
 $("fb").style.color="var(--ok)";
 $("fb").innerHTML="答对了！"+'<div class="tip" style="font-weight:400">'+st[q.i+1].t+'</div>';
 $("nq").classList.remove("hide");
 $("p2").querySelector(".score").textContent="答对 "+ok+" / "+tot;
}

/* lights */
var L=[
["照明良好的道路行驶","近光灯"],["夜间直行通过路口","近光灯"],["夜间与机动车会车","近光灯"],["夜间同方向近距离跟车","近光灯"],["通过交通信号灯控制的路口","近光灯"],
["没有路灯、照明不良的道路","远光灯"],
["通过没有交通信号灯控制的路口","远近光交替"],["通过急弯","远近光交替"],["通过坡路","远近光交替"],["通过拱桥","远近光交替"],["通过人行横道","远近光交替"],["超越前方车辆","远近光交替"],
["路边临时停车","双闪 + 行车灯"]
];
var LO=["近光灯","远光灯","远近光交替","双闪 + 行车灯"],lq,lok=0,lt=0;
function newL(){
 lq=pick(L);
 var h='<div class="score">答对 '+lok+' / '+lt+'</div><div class="card"><div class="small">语音提示：夜间</div><div class="big">'+lq[0]+'</div><div>要做什么？</div><div class="opts">';
 LO.forEach(function(o){h+='<button data-a="'+o+'">'+o+'</button>'});
 h+='</div><div id="lf" class="fb"></div><div class="nav"><button id="nl" class="on hide">下一题</button></div></div>';
 h+='<div class="card small"><b>口诀：</b>有灯/路口/会车/跟车 → 近光；没灯 → 远光；没信号灯路口、急弯、坡、拱桥、人行横道、超车 → 远近光交替；临时停车 → 双闪+示廊灯。</div>';
 $("p3").innerHTML=h;
 var done=false;
 $("p3").querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){
  if(done)return;
  if(b.dataset.a===lq[1]){done=true;lt++;lok++;b.classList.add("ok");$("lf").style.color="var(--ok)";$("lf").textContent="答对了！";$("nl").classList.remove("hide");$("p3").querySelector(".score").textContent="答对 "+lok+" / "+lt}
  else{b.classList.add("bad");b.disabled=true;lt++}
 }});
 $("nl").onclick=newL;
}
TIPS.auto="没有语音提示！要自己想起来：打灯3秒 → 看内外后视镜 → 回头看 → 打轮变道 → 回正 → 关灯。";
NAMES.forEach(function(n){R[n].forEach(function(x){if(x.n==="自主变道"){x.t=TIPS.auto;x.a=1}})});
/* animation (schematic maps, not to scale) */
var PT={
"一号线":[[20,200,0],[60,200,1],[60,270,2],[60,350,3],[140,350,4],[230,350,5],[230,300,6],[230,240,7],[230,170,8],[230,60,9],[255,60,-1],[255,120,10],[255,200,11],[255,375,12],[150,375,13]],
"二号线":[[40,390,0],[60,330,1],[80,240,2],[100,160,3],[170,150,4],[230,140,5],[230,200,6],[230,250,7],[230,300,8],[230,350,9],[230,400,10],[255,400,-1],[255,330,11],[255,260,12],[255,100,13],[200,100,14],[110,100,15]],
"三号线":[[30,370,0],[30,60,1],[130,60,2],[230,60,3],[230,120,4],[230,190,5],[230,250,6],[230,300,7],[230,350,8],[230,405,9],[255,405,-1],[255,330,10],[255,260,11],[255,210,12],[190,210,13],[100,210,14]]
};
var A={r:"一号线",i:0,t:0,wait:0,play:true,sp:1,done:false,off:0},last=0;
function pts(){return PT[A.r]}
function sigOn(s){return /转|变道|超车|掉头|停车|起步/.test(R[A.r][s].n)}
function lbl(){$("pl").textContent=A.done?"▶ 重播":(A.play?"⏸ 暂停":"▶ 播放");$("sp").textContent="速度："+(A.sp===1?"正常":"慢")}
function banner(s){
 var st=R[A.r][s];
 $("ab").innerHTML='<div class="small">第 '+(s+1)+' / '+R[A.r].length+' 步'+(sigOn(s)?' · <b style="color:var(--warn)">要打灯</b>':'')+'</div><div class="big">'+st.n+'</div><div class="tip"'+(st.a?' style="background:var(--badbg);color:var(--bad);font-weight:700"':'')+'>'+(st.a?'⚠ 没有语音提示！自己要想起来！<br>':'')+st.t+'</div>';
 document.querySelectorAll("#map g[id^=m]").forEach(function(g){g.classList.remove("act")});
 $("m"+s).classList.add("act");
}
function setPoint(i){
 A.i=i;A.t=0;if(i===0)A.ang=undefined;var p=pts()[i];
 if(p[2]>=0){banner(p[2]);A.wait=2.8/A.sp}else A.wait=0;
}
function finish(){A.done=true;$("ab").insertAdjacentHTML("beforeend",'<div class="fb" style="color:var(--ok)">路线走完了！点“重播”再来一遍。</div>');lbl()}
function nextSig(j){var p=pts()[j];return p&&p[2]>=0&&sigOn(p[2])}
function place(){
 var p=pts(),n=p.length-1,a,b,t=A.t;
 if(A.i>=n){a=p[n-1];b=p[n];t=1}else{a=p[A.i];b=p[A.i+1]}
 var x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t,ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
 if(A.ang===undefined)A.ang=ang;
 var df=((ang-A.ang)%360+540)%360-180;A.ang+=df*Math.min(1,A.dt*7);
 var rot=-90-A.ang;
 $("world").setAttribute("transform","translate(145,300) rotate("+rot+") scale(1.6) translate("+(-x)+","+(-y)+")");
 $("car").setAttribute("transform","translate("+(145+A.off*1.6)+",300)");
 document.querySelectorAll("#world .mt").forEach(function(tx){tx.setAttribute("transform","rotate("+(-rot)+" "+tx.getAttribute("x")+" "+(tx.getAttribute("y")-4)+")")});
 var hs=-1,pj=p[A.i];
 if(A.wait>0&&pj[2]>=0)hs=pj[2];else{var pk=p[A.i+1];if(pk&&pk[2]>=0&&A.t>0.3)hs=pk[2]}
 var nm=hs>=0?R[A.r][hs].n:"";
 $("hint").textContent=/左转/.test(nm)?"⬅ 左转":/右转/.test(nm)?"右转 ➡":/掉头/.test(nm)?"":/超车/.test(nm)?"⬅ 超车 先左后右 ➡":/靠边/.test(nm)?"靠边停车 ➡":/自主/.test(nm)?"⚠ 自主变道":"";
 $("uicon").style.display=/掉头/.test(nm)?"":"none";
 var g=false,cs=p[A.i][2];
 if(A.wait>0)g=cs>=0&&sigOn(cs);else g=nextSig(A.i+1)&&A.t>0.4;
 $("gl").style.display=g?"":"none";
}
function build(){
 var p=pts(),h='<div class="row">';
 NAMES.forEach(function(n){h+='<button data-ar="'+n+'" class="'+(n===A.r?"on":"")+'">'+n+'</button>'});
 h+='</div><div class="small" style="margin-bottom:8px">这条线有 <b style="color:var(--bad)">'+R[A.r].filter(function(x){return x.a}).length+'</b> 次自主变道（地图上红圈“自”）</div><div id="wn" class="mantra" style="visibility:hidden;background:var(--badbg);color:var(--bad);margin-bottom:8px">⚠ 前面要自主变道了！灯、镜、头、打、关</div><div class="card" id="ab"></div>';
 h+='<svg id="map" viewBox="0 0 290 430" role="img" aria-label="路线动画示意图" style="width:100%;height:auto;max-height:62vh;background:var(--card);border:2px solid var(--line);border-radius:14px">';
 var pp=p.map(function(q){return q[0]+","+q[1]}).join(" ");
 h+='<g id="world"><polyline points="'+pp+'" fill="none" style="stroke:var(--road)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>';
 h+='<polyline points="'+pp+'" fill="none" style="stroke:var(--acc)" stroke-width="2.5" stroke-dasharray="5 5" stroke-linejoin="round"/>';
 p.forEach(function(q){if(q[2]>=0){var au=R[A.r][q[2]].a;h+='<g id="m'+q[2]+'" class="'+(au?'auto':'')+'"><circle class="mk" cx="'+q[0]+'" cy="'+q[1]+'" r="'+(au?12:9)+'"/><text class="mt" x="'+q[0]+'" y="'+(q[1]+(au?4.5:3.5))+'">'+(au?'自':(q[2]+1))+'</text></g>'}});
 h+='</g><text id="hint" x="145" y="34" text-anchor="middle" style="font-size:20px;font-weight:800;fill:var(--ink);stroke:var(--card);stroke-width:5px;paint-order:stroke"></text><g id="uicon" style="display:none" transform="translate(145,40)"><rect x="-62" y="-24" width="124" height="48" rx="9" fill="#1565c0" stroke="#fff" stroke-width="2"/><path d="M-26,14 V-2 A8,8 0 0 0 -42,-2 V8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><polygon points="-50,6 -34,6 -42,18" fill="#fff"/><text x="16" y="8" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#fff">掉头</text></g><g id="car" transform="translate(145,300)"><g transform="rotate(-90) scale(1.4)"><circle id="gl" class="gl" r="15" style="display:none"/><rect x="-9" y="-5" width="18" height="10" rx="3" fill="#a020f0" stroke="#fff" stroke-width="1.5"/><rect x="2" y="-4" width="4" height="8" rx="1" fill="#fff" opacity=".85"/></g></g></svg>';
 h+='<div class="nav"><button id="pl" class="on"></button><button id="pv4">上一步</button><button id="nx4">下一步</button></div>';
 h+='<div class="nav"><button id="rs">重头开始</button><button id="sp"></button></div>';
 h+='<p class="small">画面是驾驶员视角，车头永远朝上；地图是示意图，不按比例；数字是第几步，红圈里的“自”是自主变道，紫色小车是你，橙色闪光表示这时要打灯。</p>';
 $("p4").innerHTML=h;
 $("p4").querySelectorAll("[data-ar]").forEach(function(b){b.onclick=function(){A.r=b.dataset.ar;A.done=false;A.play=true;build();setPoint(0)}});
 $("pl").onclick=function(){if(A.done){A.done=false;A.play=true;setPoint(0)}else A.play=!A.play;lbl()};
 $("rs").onclick=function(){A.done=false;A.play=true;setPoint(0);lbl()};
 $("sp").onclick=function(){A.sp=A.sp===1?0.6:1;lbl()};
 $("pv4").onclick=function(){var q=pts(),j;for(j=A.i-1;j>=0;j--)if(q[j][2]>=0)break;if(j<0)j=0;A.done=false;A.play=false;setPoint(j);lbl()};
 $("nx4").onclick=function(){var q=pts(),j;for(j=A.i+1;j<q.length;j++)if(q[j][2]>=0)break;if(j>=q.length)return;A.play=false;setPoint(j);lbl()};
 lbl();
}
function frame(ts){
 requestAnimationFrame(frame);
 var dt=Math.min((ts-last)/1000,0.1);last=ts;A.dt=dt;
 if($("p4").classList.contains("hide")||!$("car"))return;
 var p=pts();
 if(A.play&&!A.done){
  if(A.wait>0)A.wait-=dt;
  else if(A.i<p.length-1){
   var a=p[A.i],b=p[A.i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);
   A.t+=70*A.sp*dt/L;
   if(A.t>=1)setPoint(A.i+1);
  }else finish();
 }
 var tg=0,cp=p[A.i][2];
 if(cp>=0&&R[A.r][cp].a&&(!A.play||A.wait<2.8/A.sp*0.7))tg=12;
 A.off+=(tg-A.off)*Math.min(1,dt*5);
 var nj=p[A.i+1],na=nj&&nj[2]>=0&&R[A.r][nj[2]].a;
 $("wn").style.visibility=(A.play&&A.wait<=0&&na&&A.t>0.3)?"visible":"hidden";
 place();
}
/* quiz v2: grouped by route, one score per question (overrides the earlier newQ/answer) */
var qr="一号线",qlast=-1;
function qscore(){return "一次答对 "+ok+" / "+tot+" 题 "}
function newQ(){
 if(qm==="order"&&qr==="灯光")qr="一号线";
 if(qr==="灯光"){newL2();return}
 if(qm==="order"){newO();return}
 var st=R[qr],i,c=[];
 st.forEach(function(x,k){if(k>0&&x.a)c.push(k-1)});
 do{i=(c.length&&Math.random()<0.5)?pick(c):Math.floor(Math.random()*(st.length-1))}while(i===qlast&&st.length>2);
 qlast=i;
 var ans=st[i+1].n,pool=[];
 st.forEach(function(x,k){if(k>0&&x.n!==ans&&pool.indexOf(x.n)<0)pool.push(x.n)});
 var opts=shuf([ans].concat(shuf(pool).slice(0,3)));
 q={i:i,ans:ans,done:false,tried:false};
 var h='<div class="row">';
 NAMES.forEach(function(n){h+='<button data-qr="'+n+'" class="'+(n===qr?"on":"")+'">'+n+'</button>'});
 h+='</div><div class="score" id="sc">'+qscore()+'<button id="rz" style="min-height:36px;padding:4px 12px;font-size:15px">清零</button></div>';
 h+='<div class="card"><div class="small">'+qr+' · 第 '+(i+1)+' 步之后</div>';
 if(i>0)h+='<div class="small">前一步：'+st[i-1].n+'</div>';
 h+='<div class="small">刚做完：</div><div class="big">'+st[i].n+'</div><div>接下来是什么？</div><div class="opts">';
 opts.forEach(function(o){h+='<button data-a="'+o+'">'+o+'</button>'});
 h+='</div><div id="fb" class="fb"></div><div class="nav"><button id="nq" class="on hide">下一题</button></div></div>';
 $("p2").innerHTML=h;
 $("p2").querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){answer(b)}});
 modeUI();$("p2").querySelectorAll("[data-qr]").forEach(function(b){b.onclick=function(){qr=b.dataset.qr;qlast=-1;newQ()}});
 $("rz").onclick=function(){ok=0;tot=0;$("sc").firstChild.nodeValue=qscore()};
 $("nq").onclick=newQ;
}
function answer(b){
 if(q.done)return;
 var st=R[qr],good=b.dataset.a===q.ans;
 if(!q.tried){q.tried=true;tot++;if(good)ok++;$("sc").firstChild.nodeValue=qscore()}
 if(!good){b.classList.add("bad");b.disabled=true;$("fb").style.color="var(--bad)";$("fb").textContent="不对，再想想";return}
 q.done=true;b.classList.add("ok");
 $("fb").style.color="var(--ok)";
 $("fb").innerHTML="答对了！"+'<div class="tip" style="font-weight:400">'+st[q.i+1].t+'</div>';
 $("nq").classList.remove("hide");
}
/* order-recall mode */
var qm="choice",O=null;
function modeUI(){
 var h='<div class="row seg"><button data-qm="choice" class="'+(qm==="choice"?"on":"")+'">选择题</button><button data-qm="order" class="'+(qm==="order"?"on":"")+'">顺序默写</button></div>';
 $("p2").insertAdjacentHTML("afterbegin",h);
 $("p2").querySelectorAll("[data-qm]").forEach(function(b){b.onclick=function(){qm=b.dataset.qm;newQ()}});
 var rw=$("p2").querySelector(".row:not(.seg)");
 if(rw&&qm==="choice")rw.insertAdjacentHTML("beforeend",'<button data-qr="灯光" class="'+(qr==="灯光"?"on":"")+'">灯光</button>');
}
function newO(){
 var st=R[qr],bank=[];
 st.forEach(function(x,k){if(k>0&&bank.indexOf(x.n)<0)bank.push(x.n)});
 O={n:1,miss:0,hint:0,bank:shuf(bank)};
 drawO();
}
function drawO(){
 var st=R[qr],fin=O.n>=st.length,h='<div class="row">';
 NAMES.forEach(function(n){h+='<button data-qr="'+n+'" class="'+(n===qr?"on":"")+'">'+n+'</button>'});
 h+='</div><div class="card"><div class="small">'+qr+'：从起点开始，按顺序点出每一步（共 '+st.length+' 步）</div><ul class="list">';
 for(var k=0;k<O.n;k++)h+='<li>'+(k+1)+'. <b'+(st[k].a?' style="color:var(--bad)"':'')+'>'+st[k].n+'</b></li>';
 if(!fin)h+='<li class="small">第 '+(O.n+1)+' 步是？</li>';
 h+='</ul>';
 if(fin){
  h+='<div class="fb" style="color:var(--ok)">'+(O.miss===0&&O.hint===0?'全对！太棒了！':'完成！点错 '+O.miss+' 次，用提示 '+O.hint+' 次。')+'</div><div class="nav"><button id="oa" class="on">再来一次</button></div>';
 }else{
  h+='<div class="opts" style="grid-template-columns:1fr 1fr">';
  O.bank.forEach(function(o){h+='<button data-o="'+o+'"'+(o==="自主变道"?' style="color:var(--bad);font-weight:700"':'')+'>'+o+'</button>'});
  h+='</div><div id="of" class="fb"></div><div class="nav"><button id="oh">提示</button><button id="oa">重来</button></div>';
 }
 h+='</div>';
 $("p2").innerHTML=h;
 modeUI();
 $("p2").querySelectorAll("[data-qr]").forEach(function(b){b.onclick=function(){qr=b.dataset.qr;newQ()}});
 $("p2").querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){oPick(b.dataset.o)}});
 if($("oa"))$("oa").onclick=newO;
 if($("oh"))$("oh").onclick=function(){O.hint++;$("of").style.color="var(--warn)";$("of").textContent="提示：下一步是“"+R[qr][O.n].n+"”"};
}
function oPick(name){
 if(name===R[qr][O.n].n){O.n++;drawO()}
 else{O.miss++;$("of").style.color="var(--bad)";$("of").textContent="不对，再想想（点错 "+O.miss+" 次）"}
}
/* lights: study page + merged quiz */
var lqd={tried:false,done:false},LH={"近光灯":"亮、口、会、跟 → 近光（照明好、有灯路口、会车、跟车）","远光灯":"黑路 → 远光（没路灯、照明不良）","远近光交替":"弯、坡、拱、人、超、无灯口 → 远近光交替","双闪 + 行车灯":"临时停车 → 开双闪 + 开行车灯"};
function lscore(){return "一次答对 "+lok+" / "+lt+" 题 "}
function newL2(){
 lq=pick(L);lqd={tried:false,done:false};
 var h='<div class="row">';
 NAMES.forEach(function(n){h+='<button data-qr="'+n+'">'+n+'</button>'});
 h+='</div><div class="score" id="sc">'+lscore()+'<button id="rz" style="min-height:36px;padding:4px 12px;font-size:15px">清零</button></div>';
 h+='<div class="card"><div class="small">语音提示：夜间</div><div class="big">'+lq[0]+'</div><div>要做什么？</div><div class="opts">';
 LO.forEach(function(o){h+='<button data-a="'+o+'">'+o+'</button>'});
 h+='</div><div id="fb" class="fb"></div><div class="nav"><button id="nq" class="on hide">下一题</button></div></div>';
 $("p2").innerHTML=h;
 modeUI();
 $("p2").querySelectorAll("[data-qr]").forEach(function(b){b.onclick=function(){qr=b.dataset.qr;qlast=-1;newQ()}});
 $("p2").querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){lAnswer(b)}});
 $("rz").onclick=function(){lok=0;lt=0;$("sc").firstChild.nodeValue=lscore()};
 $("nq").onclick=newQ;
}
function lAnswer(b){
 if(lqd.done)return;
 var good=b.dataset.a===lq[1];
 if(!lqd.tried){lqd.tried=true;lt++;if(good)lok++;$("sc").firstChild.nodeValue=lscore()}
 if(!good){b.classList.add("bad");b.disabled=true;$("fb").style.color="var(--bad)";$("fb").textContent="不对，再想想";return}
 lqd.done=true;b.classList.add("ok");
 $("fb").style.color="var(--ok)";
 $("fb").innerHTML="答对了！"+'<div class="tip" style="font-weight:400">'+LH[lq[1]]+'</div>';
 $("nq").classList.remove("hide");
}
function lightPage(){
 var G=[
 ["近光灯","#0f8f8f","亮、口、会、跟 → 近光",["请开启前照灯","夜间在照明良好的道路上行驶","夜间直行通过路口","夜间与机动车会车","夜间同方向近距离跟车行驶","夜间通过交通信号灯控制的路口"]],
 ["远光灯","#1e6bd6","黑路 → 远光",["夜间在没有路灯、照明不良的道路上行驶"]],
 ["远近光交替","#a020f0","弯、坡、拱、人、超、无灯口 → 远近光交替",["夜间通过没有交通信号灯控制的路口","夜间通过急弯","夜间通过坡路","夜间通过拱桥","夜间通过人行横道","夜间超越前方车辆"]],
 ["双闪 + 行车灯","#ef6c00","临时停车 → 开双闪 + 开行车灯",["路边临时停车"]],
 ["关闭所有灯光","#6b7a77","结束 → 全关，继续考其他项目",["模拟夜间考试完成，请关闭所有灯光"]]
 ];
 var h='<div class="card"><b>灯光考试流程</b><ul class="list"><li>1. 听到“请开始考试”：下车，逆时针绕车一周（先按右后方按钮，再按左前方按钮）</li><li>2. 上车，系安全带，踩刹车，打火 → 灯光模拟开始</li><li>3. 语音说“请在5秒内做出相应的灯光操作”：<b>听完再做，5秒内完成</b></li><li>4. 灯光顺序是随机的，按下面四类操作</li><li>5. 听到“请关闭所有灯光”：关灯，继续后面的项目，再打左转向灯起步</li></ul><div class="small">具体动作以教练指导为准。</div></div>';
 h+='<div class="mantra">口诀：亮口会跟用近光；黑路用远光；弯坡拱人超、无灯路口，远近交替；停车双闪加行车灯。</div>';
 G.forEach(function(g){
  h+='<div class="card" style="border-left:10px solid '+g[1]+'"><div class="big" style="font-size:28px">'+g[0]+'</div><div style="font-weight:700;color:var(--warn)">'+g[2]+'</div><div class="small" style="margin-top:6px">语音提示包括：</div><ul class="list">';
  g[3].forEach(function(s){h+='<li>'+s+'</li>'});
  h+='</ul></div>';
 });
 $("p3").innerHTML=h;
}
lightPage();
build();setPoint(0);requestAnimationFrame(frame);
learn();
</script>
